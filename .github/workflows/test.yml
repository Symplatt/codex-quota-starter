name: Windows tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -X utf8 -m unittest discover -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test_ui.cjs
      - run: python -X utf8 build_release.py
