<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>额度启程</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#19352e;background:#f4f5ef}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:36px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:30px;margin:0}h2{font-size:17px;margin:0 0 18px}.badge{padding:8px 14px;background:#dbeadd;border-radius:24px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px}.card,.panel{background:#fff;border:1px solid #dfe5da;border-radius:14px;padding:22px}.panel{margin-top:20px}.label,.small{color:#68796c;font-size:13px;line-height:1.8}.value{font-size:25px;font-weight:600;margin:12px 0 6px;font-variant-numeric:tabular-nums}.time-value{font-size:22px}.status{line-height:1.8;overflow-wrap:anywhere}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}button,.link{font:inherit;font-size:14px;border:1px solid #ced8ca;background:white;border-radius:9px;padding:10px 18px;color:#234d3a;cursor:pointer;text-decoration:none}button.primary{background:#244f3d;color:white;border-color:#244f3d}button:disabled{opacity:.5;cursor:default}input[type=datetime-local]{font:inherit;border:1px solid #c6d1c4;padding:9px 12px;border-radius:8px;color:#19352e;max-width:100%;background:#fff}input[type=checkbox]{width:18px;height:18px;accent-color:#244f3d}label{display:block}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:12px 8px;border-bottom:1px solid #edf0e9;vertical-align:top}th{font-weight:500;color:#718074}td:last-child{line-height:1.7;overflow-wrap:anywhere}summary{cursor:pointer;font-size:13px;margin-top:18px}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:280px;overflow:auto}.feedback{font-size:13px;line-height:1.8;color:#3d7358}.feedback:empty{display:none}.feedback:not(:empty){margin-top:12px}.timing{margin:0 0 22px}.timing .card{padding:0;border:0}.info{display:flex;gap:24px;flex-wrap:wrap;font-size:14px}@media(max-width:760px){main{margin:24px auto;padding:0 16px}.grid{grid-template-columns:1fr}.value{font-size:23px}h1{font-size:25px}header{flex-wrap:wrap}.tablewrap{overflow:auto}.timing{gap:18px}}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.section-head h2{margin:0}.time-pair{display:grid;grid-template-columns:1fr 1fr;margin:22px 0;gap:24px}.time-block+ .time-block{border-left:1px solid #e3e8df;padding-left:24px}.clock{font-size:32px;line-height:1.3;font-weight:600;letter-spacing:.5px;margin:10px 0 3px;font-variant-numeric:tabular-nums}.count-chip,.estimate-tag{display:inline-block;margin-left:8px;font-size:12px;font-weight:400}.count-chip{color:#315e46}.estimate-tag{color:#748174}.time-input{margin-top:8px}.time-hint{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:10px;font-size:12px;line-height:1.7;color:#526c5b}#time-range{font-variant-numeric:tabular-nums}.state-chip{font-size:13px;color:#315e46;background:#edf3eb;border-radius:6px;padding:6px 10px}.run-row{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:18px}.run-row .actions{margin:0}.checks{display:grid;gap:2px;font-size:12px;white-space:nowrap}.checks time{display:inline-block;margin-left:8px;font-variant-numeric:tabular-nums}.status-details summary{font-size:12px;color:#68796c;margin-top:14px}.status-details .status{margin-top:8px}@media(max-width:620px){.time-pair{gap:14px}.time-block+ .time-block{padding-left:14px}.clock{font-size:25px}.count-chip,.estimate-tag{display:block;margin:2px 0 0}.run-row{align-items:flex-start;flex-direction:column}.time-input input{width:100%}}
</style></head><body><main>
<header><h1>额度启程</h1><div style="display:flex;gap:12px;align-items:center"><span class="badge" id="badge">连接中</span><a class="link" href="/help">帮助</a></div></header>
<div class="grid">
<section class="card"><div class="label">五小时剩余额度</div><div class="value" id="remaining">—</div><div class="small" id="weekly">每周额度：等待检测</div></section>
<section class="card"><div class="label">服务器刷新时间</div><div class="value time-value" id="reset">—</div><div class="small">北京时间</div></section>
<section class="card"><div class="label">上次发送请求</div><div class="value time-value" id="last">尚未发送</div><div class="small" id="result"></div></section>
</div>
<section class="panel time-panel"><div class="section-head"><h2>时间设置</h2><span class="small">北京时间</span></div>
<div class="time-pair">
<div class="time-block"><div class="label">请求发送 <span class="count-chip" id="countdown"></span></div><div class="clock" id="send-at">—</div><div class="small" id="send-date"></div></div>
<div class="time-block"><div class="label">预计刷新 <span class="estimate-tag">+5 小时 · 估计</span></div><div class="clock" id="estimated-reset">—</div><div class="small" id="reset-date"></div></div>
</div>
<form id="schedule-form"><label for="schedule-time" class="label">手动时间</label><div class="actions time-input"><input id="schedule-time" type="datetime-local" step="1" required disabled aria-describedby="time-rule time-range"><button class="primary" id="save-time" type="submit" disabled>保存</button><button id="auto-time" type="button" onclick="window.action('schedule/clear','schedule-feedback')">恢复自动</button></div><div class="time-hint"><span id="time-rule">仅可选 GPT 正常刷新时刻之后</span><span id="time-range">等待检测</span></div></form>
<div class="feedback" id="schedule-feedback" role="status"></div></section>
<section class="panel"><div class="section-head"><h2>运行状态</h2><span class="state-chip" id="status">连接中</span></div><div class="run-row"><div class="actions"><button class="primary" id="trigger" onclick="action('trigger')">手动触发一次</button><button id="pause" onclick="action(paused?'resume':'pause')">暂停</button><button onclick="action('check')">立即检测</button></div><div class="checks small"><span>上次检测 <time id="checked">—</time></span><span>下次检测 <time id="next-check">—</time></span></div></div><details class="status-details"><summary>状态详情</summary><div class="small status" id="status-detail"></div></details><div class="feedback" id="toast" role="status"></div></section>
<section class="panel"><h2>触发记录</h2><div class="tablewrap"><table><thead><tr><th>时间（北京时间）</th><th>结果</th><th>周期验证</th></tr></thead><tbody id="history"></tbody></table></div><details><summary>查看检测日志</summary><pre id="logs"></pre></details></section>
<section class="panel"><h2>设置</h2><label style="display:flex;align-items:center;gap:12px"><input type="checkbox" id="autostart" disabled onchange="setAutostart(this.checked)"><span>开机自启动（登录 Windows 后）</span></label><div class="small" id="startup-status"></div></section>
<section class="panel"><h2>软件信息</h2><div class="info"><span>名称：额度启程</span><span>版本：<strong id="version">—</strong></span></div></section>
</main><script>
const token='__CSRF__';let paused=false,snapshot=null,startupBusy=false,timeDirty=false,lastScheduleId;
const $=id=>document.getElementById(id);
const time=s=>s?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(s*1000)):'—';
const inputTime=s=>new Date(s*1000+8*3600000).toISOString().slice(0,19);
const labels={completed:'已完成',failed:'失败',interrupted:'已中断',unknown:'结果未知',reserved:'待核实'};
const clockTime=s=>s?time(s).split(' ')[1]:'—';
function timeBlock(id,dateId,value){$(id).textContent=clockTime(value);$(dateId).textContent=value?time(value).split(' ')[0]:'—';}
function shortStatus(s){if(s.paused)return '已暂停';if(s.busy)return '处理中';const v=s.status;if(v.startsWith('连接/检测失败'))return '检测失败';if(v.includes('额度受限'))return '额度受限';if(v.includes('手动设定'))return '等待计划';if(v.includes('本周期')||v.includes('已处理'))return '本轮已处理';if(v.includes('重置时间')||v.includes('窗口已变化'))return '等待刷新';if(v.includes('请求完成')||v.includes('观察到'))return '已完成';if(v.includes('未确认'))return '待核实';return '检测中';}
function renderTiming(t){if(!t)return;timeBlock('send-at','send-date',t.sendAt);timeBlock('estimated-reset','reset-date',t.estimatedResetAt);const plan=t.schedule;const id=plan?.id||null;if(id!==lastScheduleId&&!timeDirty){$('schedule-time').value=plan?.status==='pending'?inputTime(plan.sendAt):'';lastScheduleId=id;}const min=t.minSendAt;$('schedule-time').disabled=!min;$('schedule-time').min=min?inputTime(min):'';$('save-time').disabled=!min||snapshot.busy;$('time-range').textContent=min?'可选起点 '+time(min):'等待检测';countdown();}
function countdown(){const t=snapshot?.timing;if(!t)return;const left=t.sendAt-Date.now()/1000;const pad=n=>String(n).padStart(2,'0');$('countdown').textContent=paused?'已暂停':!t.sendAt?'待检测':left>0?'倒计时 '+pad(Math.floor(left/3600))+':'+pad(Math.floor(left%3600/60))+':'+pad(Math.floor(left%60)):'已到点';}
async function refresh(){try{const r=await fetch('/api/status');if(!r.ok)throw Error(r.status);const s=await r.json();snapshot=s;paused=s.paused;$('version').textContent='v'+s.version;$('badge').textContent=paused?'已暂停':s.busy?'正在检测 / 发送':'后台运行';$('pause').textContent=paused?'恢复运行':'暂停';$('trigger').disabled=paused||s.busy;$('save-time').disabled=s.busy;$('auto-time').disabled=s.busy;$('status').textContent=shortStatus(s);$('status-detail').textContent=s.status;const c=s.current;if(c){$('remaining').textContent=(100-c.primary.usedPercent)+'%';$('weekly').textContent=c.secondary?'长周期（'+Math.round(c.secondary.windowDurationMins/1440)+' 天）剩余 '+(100-c.secondary.usedPercent)+'%':'长周期：未返回';$('reset').textContent=time(c.primary.resetsAt);$('checked').textContent=clockTime(c.checkedAt);$('checked').title=time(c.checkedAt);$('next-check').textContent=clockTime(s.nextPoll);$('next-check').title=time(s.nextPoll);}renderTiming(s.timing);renderAutostart(s.autostart);const a=s.attempts[0];if(a){$('last').textContent=time(a.started);$('result').textContent=labels[a.status]||a.status;}const body=$('history');body.replaceChildren();for(const a of s.attempts){const tr=document.createElement('tr');for(const text of [time(a.started),labels[a.status]||a.status,a.detail.evidence||'请求已预留，本周期不重复提交']){const td=document.createElement('td');td.textContent=text;tr.append(td);}body.append(tr);}if(!s.attempts.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=3;td.textContent='暂无记录';tr.append(td);body.append(tr);}$('logs').textContent=s.events.map(e=>time(e.time)+' '+e.kind+' '+JSON.stringify(e.detail)).join('\n');}catch(e){$('badge').textContent='服务离线';$('status').textContent='服务离线';$('status-detail').textContent='请通过桌面快捷方式启动。';$('schedule-time').disabled=true;for(const id of ['trigger','save-time','auto-time','autostart'])$(id).disabled=true;}}
async function action(name,feedback='toast',body){try{const r=await fetch('/api/'+name,{method:'POST',headers:{'X-Quota-Token':token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();$(feedback).textContent=d.message||d.error;if(r.ok&&name.startsWith('schedule')){timeDirty=false;lastScheduleId=undefined;}await refresh();return r.ok;}catch(e){$(feedback).textContent='操作失败：本地服务不可达';return false;}}
function saveTime(){const v=$('schedule-time').value;const sendAt=Date.parse(v.length===16?v+':00+08:00':v+'+08:00')/1000;const reset=snapshot?.timing?.serverResetAt;if(!reset){$('schedule-feedback').textContent='请先检测 GPT 刷新时间';return;}if(!v||!Number.isFinite(sendAt)||sendAt<=Date.now()/1000){$('schedule-feedback').textContent='请选择未来时间';return;}if(sendAt<=reset){$('schedule-feedback').textContent='仅可选 GPT 正常刷新时刻之后';return;}action('schedule','schedule-feedback',{sendAt});}
$('schedule-form').addEventListener('submit',e=>{e.preventDefault();saveTime();});
$('schedule-time').addEventListener('invalid',()=>{$('schedule-feedback').textContent='请选择可选起点之后的时间（含起点）';});
$('schedule-time').addEventListener('input',()=>{timeDirty=true;});
function renderAutostart(a){if(startupBusy||!a)return;$('autostart').disabled=!a.available;$('autostart').checked=a.enabled===true;$('startup-status').textContent=a.error|| (a.enabled?'已开启':'已关闭');}
async function setAutostart(enabled){startupBusy=true;$('autostart').disabled=true;await action('autostart/'+(enabled?'enable':'disable'));startupBusy=false;await refresh();}
setInterval(countdown,1000);setInterval(refresh,3000);refresh();
</script></body></html>
