<div class="grid">

<dialog id="refresh-dialog" aria-labelledby="refresh-title" aria-describedby="refresh-description"><header class="refresh-header"><h2 id="refresh-title">选择时间</h2><button type="button" id="close-refresh" aria-label="关闭">×</button></header><p class="refresh-description" id="refresh-description">选择<strong>完成刷新</strong>的时间</p><div class="manual-date"><div class="manual-field"><label for="manual-year">年</label><input id="manual-year" type="text" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="输入年" aria-describedby="refresh-error"></div><div class="manual-field"><label for="manual-month">月</label><input id="manual-month" type="text" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="输入月" aria-describedby="refresh-error"></div><div class="manual-field"><label for="manual-day">日</label><input id="manual-day" type="text" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="输入日" aria-describedby="refresh-error"></div><div class="manual-field"><label for="manual-hour">时</label><input id="manual-hour" type="text" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="输入时" aria-describedby="refresh-error"></div><div class="manual-field"><label for="manual-minute">分</label><input id="manual-minute" type="text" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="输入分" aria-describedby="refresh-error"></div></div><div class="wheel-grid" id="wheel-grid"></div><div id="refresh-error" class="feedback" role="status"></div><footer class="refresh-footer"><button type="button" id="cancel-refresh">取消</button><button type="button" class="primary" id="save-time">确定</button></footer></dialog>
</section>
<section class="panel run-panel"><div class="section-head"><h2>运行状态</h2></div><div class="actions"><button class="primary" id="recheck" onclick="recheckQuota()">重新检测</button><button id="reconnect" onclick="action('reconnect')">重新连接</button><button id="pause" onclick="action(paused?'resume':'pause')">暂停</button></div><div class="panel-metrics"><div class="metric"><div class="metric-label"><svg class="time-glyph" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="7.25"/><path d="M10 5.5V10l3 1.8"/></svg>上次检测</div><div class="metric-value" id="checked">—</div><div class="metric-date" id="checked-date">—</div></div><div class="metric"><div class="metric-label"><svg class="time-glyph" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false"><path d="M16.4 8A6.7 6.7 0 1 0 16 13M16.5 3.5V8H12"/></svg>下次检测</div><div class="metric-value" id="next-check">—</div><div class="metric-date" id="next-check-date">—</div></div></div><div class="panel-footer" aria-live="polite"><span class="footer-dot" aria-hidden="true"></span><span class="state-chip" id="status">连接中</span><span id="status-detail" hidden></span></div></section>
</div><section class="panel"><h2>触发记录</h2><div class="tablewrap"><table><thead><tr><th>时间（北京时间）</th><th>结果</th><th>周期验证</th></tr></thead><tbody id="history"></tbody></table></div><details><summary>查看检测日志</summary><pre id="logs"></pre></details></section>
<section class="panel"><h2>设置</h2><label style="display:flex;align-items:center;gap:12px"><input type="checkbox" id="autostart" disabled onchange="setAutostart(this.checked)"><span>开机自启动</span></label><div class="small" id="startup-error" role="status"></div></section>
<section class="panel"><h2>软件信息</h2><div class="info"><span>名称：额度启程</span><span>版本：<strong id="version">—</strong></span><span>版权所有 © 2026 Symplatt</span></div></section>
</main><div class="feedback-stack"><div class="feedback" id="schedule-feedback" role="status"></div><div class="feedback" id="toast" role="status"></div></div><dialog id="help-dialog" aria-labelledby="help-title"><div class="help-header"><div><h2 id="help-title">使用帮助</h2><p>额度启程 · 常用操作说明</p></div><button id="close-help" type="button" aria-label="关闭帮助">×</button></div><div class="help-content">__HELP_CONTENT__</div></dialog><script>
const helpDialog=document.getElementById('help-dialog');

let backdropDown=false;
helpDialog.addEventListener('pointerdown',e=>{const r=helpDialog.getBoundingClientRect();backdropDown=e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom;});
helpDialog.addEventListener('click',e=>{const r=helpDialog.getBoundingClientRect();if(backdropDown&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))helpDialog.close();backdropDown=false;});
let token='__CSRF__';let paused=false,snapshot=null,startupBusy=false,refreshPromise=null,recheckBusy=false,connected=false;

const time=s=>s?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(s*1000)):'—';
const inputTime=s=>new Date(s*1000+8*3600000).toISOString().slice(0,19);
const labels={completed:'已完成',failed:'失败',interrupted:'已中断',unknown:'结果未知',reserved:'待核实'};
const clockTime=s=>s?time(s).split(' ')[1]:'—';
function cardTime(id,value){const target=$(id);target.textContent=time(value);if(!value)return;const date=document.createElement('span');date.className='card-date';date.textContent=time(value).split(' ')[0];target.replaceChildren(date,' '+clockTime(value));}
function timeBlock(id,dateId,value){$(id).textContent=clockTime(value);$(dateId).textContent=value?time(value).split(' ')[0]:'—';}
function shortStatus(s){
 if(s.connection?.stopped)return '已断开，等待重新连接';
 const phases={connecting:'正在连接',checking:'正在检测额度',preparing:'正在准备小额请求',sending:'正在发送小额请求',verifying:'正在核验请求结果'};
 if(s.busy&&phases[s.phase])return phases[s.phase];
 if(s.connection?.failures)return '等待第 '+(s.connection.failures+1)+'/5 次尝试';
 if(s.paused)return '已暂停';
 const v=s.status;
 if(v.includes('计划已取消'))return '计划已自动取消';
 if(v.includes('额度已更新'))return '已连接，检测完成';
 if(v.startsWith('连接/检测失败'))return '检测失败';
 if(v.includes('额度受限'))return '额度受限';
 if(v.includes('手动设定'))return '等待计划';
 if(v.includes('本周期')||v.includes('已处理'))return '本轮已处理';
 if(v.includes('重置时间')||v.includes('窗口已变化'))return '等待刷新';

function updateControls(){
 const busy=Boolean(snapshot?.busy),offline=!connected,stopped=Boolean(snapshot?.connection?.stopped);
 const changing=pendingActions.has('schedule')||pendingActions.has('schedule/clear');
 $('reconnect').disabled=offline||busy||pendingActions.has('reconnect');
 $('recheck').disabled=offline||busy||stopped||recheckBusy||pendingActions.has('check');
 $('choose-time').disabled=offline||busy||changing||!snapshot?.timing?.minRefreshAt;
 $('auto-time').disabled=offline||busy||changing;
 $('save-time').disabled=offline||busy||changing||manualDirty||!snapshot?.timing?.minRefreshAt;

}
function renderTiming(t){if(!t)return;timeBlock('send-at','send-date',t.sendAt);timeBlock('estimated-reset','reset-date',t.estimatedResetAt);updateControls();if(refreshDialog.open)renderWheels();countdown();}

const refreshDialog=$('refresh-dialog');
let draftRefresh=null,wheelSignature="",manualDirty=false;
const manualKeys=['year','month','day','hour','minute'];
function syncManualDate(){manualDirty=false;const p=parts(draftRefresh);p[1]++;manualKeys.forEach((key,i)=>{$('manual-'+key).value=i===0?String(p[i]):pad(p[i]);$('manual-'+key).setAttribute('aria-invalid','false');});$('refresh-error').textContent='';}

 if(!manualDirty)return true;

 let message='请输入有效的年、月、日、时、分';
 if(values.every((v,i)=>(i===0?/^\d{4}$/:/^\d{1,2}$/).test(v))){
  const p=values.map(Number);p[1]--;const next=stamp(p),actual=parts(next);
  if(actual.every((v,i)=>v===p[i])){const {min,max}=bounds();if(min&&next>=min&&next<=max){draftRefresh=next;syncManualDate();wheelSignature='';renderWheels();return true;}message='所选时间不在可选范围内';}
 }
 $('refresh-error').textContent=message;manualKeys.forEach(key=>$('manual-'+key).setAttribute('aria-invalid','true'));$('save-time').disabled=true;return false;
}
manualKeys.forEach(key=>{
 const input=$('manual-'+key);
 input.addEventListener('input',()=>{manualDirty=true;$('save-time').disabled=true;});
 input.addEventListener('change',applyManualDate);
 input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(applyManualDate())$('save-time').focus();}});
});
const fields=[['year','年'],['month','月'],['day','日'],['hour','时'],['minute','分']];
const pad=n=>String(n).padStart(2,'0');
function bounds(){const t=snapshot?.timing;return {min:t?.minRefreshAt?Math.max(t.minRefreshAt,(Math.floor(Date.now()/60000)+1)*60+18000):null,max:t?.maxRefreshAt};}
function parts(ts){const d=new Date(ts*1000+28800000);return [d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes()];}
function stamp(p){return Date.UTC(p[0],p[1],p[2],p[3],p[4])/1000-28800;}
function candidates(index){
 const p=parts(draftRefresh),{min,max}=bounds(),lo=parts(min),hi=parts(max),items=[];
 const count=index===0?hi[0]-lo[0]+3:index===1?12:index===2?new Date(Date.UTC(p[0],p[1]+1,0)).getUTCDate():index===3?24:60;
 for(let i=0;i<count;i++){
  const value=index===0?lo[0]-1+i:index===2?i+1:i;
  const q=p.slice();q[index]=value;for(let j=index+1;j<5;j++)q[j]=j===2?1:0;
  const start=stamp(q);let end;
  if(index===0)end=stamp([value+1,0,1,0,0])-60;
  else if(index===1)end=stamp([p[0],value+1,1,0,0])-60;
  else end=start+(index===2?86400:index===3?3600:60)-60;
  items.push({value,label:index===0?String(value):pad(index===1?value+1:value),start,end,disabled:end<min||start>max});
 }
 return items;
}
function selected(index){return parts(draftRefresh)[index];}
function selectPart(index,item){
 if(item.disabled)return;
 const p=parts(draftRefresh);p[index]=item.value;
 if(index<2)p[2]=Math.min(p[2],new Date(Date.UTC(p[0],p[1]+1,0)).getUTCDate());
 const {min,max}=bounds();draftRefresh=Math.max(min,Math.min(max,stamp(p)));syncManualDate();renderWheels();
}
function stepWheel(index,direction){const items=candidates(index).filter(x=>!x.disabled),current=items.findIndex(x=>x.value===selected(index));const next=items[current+direction];if(next)selectPart(index,next);}
function renderWheels(){
 const {min,max}=bounds();if(!min||!max)return;
 $('save-time').disabled=!connected||snapshot.busy||pendingActions.has('schedule')||manualDirty||draftRefresh<min||draftRefresh>max;
 const signature=[min,max,draftRefresh,snapshot.busy].join(':');if(signature===wheelSignature)return;wheelSignature=signature;
 fields.forEach(([key],index)=>{const list=$('wheel-'+key);list.replaceChildren();for(const item of candidates(index)){const button=document.createElement('button');button.type='button';button.textContent=item.label;button.disabled=item.disabled;button.className='wheel-option'+(item.value===selected(index)?' selected':'');button.setAttribute('aria-pressed',String(item.value===selected(index)));button.setAttribute('aria-label',item.label+fields[index][1]);button.addEventListener('click',()=>selectPart(index,item));list.append(button);}const active=list.querySelector('.selected');if(active)list.scrollTop=active.offsetTop-(list.clientHeight-active.offsetHeight)/2;});
 $('save-time').disabled=!connected||snapshot.busy||pendingActions.has('schedule')||manualDirty||draftRefresh<min||draftRefresh>max;
}
fields.forEach(([key,label],index)=>{const column=document.createElement('div');column.className='wheel-column';const list=document.createElement('div');list.id='wheel-'+key;list.className='wheel-list';list.tabIndex=0;list.setAttribute('role','group');list.setAttribute('aria-label',label);column.append(list);$('wheel-grid').append(column);let last=0;column.addEventListener('wheel',e=>{e.preventDefault();if(!e.deltaY)return;const now=Date.now();if(now-last<90)return;last=now;stepWheel(index,e.deltaY>0?1:-1);},{passive:false});list.addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp','PageDown','PageUp'].includes(e.key)){e.preventDefault();stepWheel(index,['ArrowDown','PageDown'].includes(e.key)?1:-1);list.focus();}});});
$('choose-time').addEventListener('click',()=>{const {min,max}=bounds();if(!min||!max)return;draftRefresh=Math.max(min,Math.min(max,Math.ceil((snapshot.timing.estimatedResetAt||min)/60)*60));syncManualDate();wheelSignature='';refreshDialog.showModal();renderWheels();});

function countdown(){const t=snapshot?.timing;if(!t)return;const left=t.sendAt-Date.now()/1000;const pad=n=>String(n).padStart(2,'0');$('countdown').textContent=snapshot.connection?.stopped?'已停止，等待重新连接':paused?'已暂停':!t.sendAt?'待检测':left>0?'倒计时 '+pad(Math.floor(left/3600))+':'+pad(Math.floor(left%3600/60))+':'+pad(Math.floor(left%60)):'已到点';}

 $('status').textContent=shortStatus(s);$('status-detail').textContent=s.status;$('status').title=s.status;

 if(c){$('remaining').textContent=(100-c.primary.usedPercent)+'%';$('weekly').textContent=c.secondary?'长周期（'+Math.round(c.secondary.windowDurationMins/1440)+' 天）剩余 '+(100-c.secondary.usedPercent)+'%':'长周期：未返回';cardTime('reset',c.primary.resetsAt);timeBlock('checked','checked-date',c.checkedAt);$('checked').title=time(c.checkedAt);}

 for(const a of s.attempts){const tr=document.createElement('tr');for(const text of [time(a.started),labels[a.status]||a.status,a.detail.evidence||'请求已预留，本周期不重复提交']){const td=document.createElement('td');td.textContent=text;tr.append(td);}body.append(tr);}

}

function showOffline(){connected=false; $('badge').textContent='连接中断';$('status').textContent='等待重连';$('status-detail').textContent=snapshot?'连接暂时中断，保留上次数据，正在自动重试。':'请通过桌面快捷方式启动。';$('status').title=$('status-detail').textContent;for(const id of ['reconnect','pause','recheck','save-time','auto-time','autostart','choose-time'])$(id).disabled=true;}
function completeStatus(s){
  return s?.service==='quota-starter'&&typeof s.status==='string'&&typeof s.paused==='boolean'
    &&s.timing&&Array.isArray(s.attempts)&&Array.isArray(s.events);
}
function restoreStatus(){
  try{const s=JSON.parse(sessionStorage.getItem(cacheKey));if(completeStatus(s)){
    renderStatus(s);
    connected=false;
    // Cached values are for display only until the live service answers.
    for(const id of ['reconnect','pause','recheck','save-time','auto-time','autostart','choose-time'])$(id).disabled=true;
  }}catch(e){/* Storage may be disabled or contain an obsolete snapshot. */}

async function refresh(){
  if(refreshPromise)return refreshPromise;
  refreshPromise=(async()=>{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),15000);
    try{
      const r=await fetch('/api/status',{signal:controller.signal,cache:'no-store'});
      if(!r.ok)throw Error(r.status);
      const s=await r.json();
      if(!completeStatus(s))throw Error('invalid status');
      renderStatus(s);
      if(!s.busy)try{sessionStorage.setItem(cacheKey,JSON.stringify(s));}catch(e){}
    }catch(e){showOffline();}
    finally{clearTimeout(timeout);}
  })();
  try{await refreshPromise;}finally{refreshPromise=null;}
}
const feedbackTimers=new Map();
function showFeedback(id,message,success=false){
 clearTimeout(feedbackTimers.get(id));feedbackTimers.delete(id);
 $(id).textContent=message;
 if(id==='schedule-feedback'||id==='toast'){
  feedbackTimers.set(id,setTimeout(()=>{$(id).textContent='';feedbackTimers.delete(id);},success?3500:7000));
 }
}
async function recheckQuota(){if(recheckBusy)return;recheckBusy=true;updateControls();try{await action('check');}finally{recheckBusy=false;updateControls();}}
async function action(name,feedback='toast',body){
 if(pendingActions.has(name))return false;
 pendingActions.add(name);updateControls();
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),25000);
 try{
  const payload=body===undefined?undefined:JSON.stringify(body);
  const send=()=>fetch('/api/'+name,{method:'POST',signal:controller.signal,headers:{'X-Quota-Token':token,'Content-Type':'application/json'},body:payload});
  let r=await send(),d=await r.json();
  if(r.status===403&&d.code==='stale_session'){
   const session=await fetch('/api/session',{signal:controller.signal,headers:{'X-Quota-Session':'refresh'},cache:'no-store'});
   if(!session.ok)throw Error('session refresh failed');
   const fresh=await session.json();
   if(typeof fresh.token!=='string'||!fresh.token)throw Error('invalid session');
   token=fresh.token;r=await send();d=await r.json();
  }
  showFeedback(feedback,d.message||d.error,r.ok);
  if(refreshPromise)await refreshPromise;
  await refresh();return r.ok;
 }catch(e){showOffline();showFeedback(feedback,'操作结果未确认，请检查当前状态后重试');return false;}
 finally{clearTimeout(timer);pendingActions.delete(name);updateControls();if(refreshDialog.open)renderWheels();}
}

async function saveTime(){if(!applyManualDate())return;const {min,max}=bounds();if(!min||draftRefresh<min||draftRefresh>max){$('refresh-error').textContent='请选择可选范围内的刷新时间';renderWheels();return;}$('save-time').disabled=true;if(await action('schedule','refresh-error',{refreshAt:draftRefresh})){refreshDialog.close();showFeedback('schedule-feedback','已保存刷新时间',true);}else renderWheels();}
$('save-time').addEventListener('click',saveTime);
function renderAutostart(a){if(startupBusy||!a)return;$('autostart').disabled=!a.available;if(a.enabled!==null)$('autostart').checked=a.enabled===true;$('startup-error').textContent=a.error||'';}
async function setAutostart(enabled){startupBusy=true;$('autostart').disabled=true;await action('autostart/'+(enabled?'enable':'disable'));startupBusy=false;await refresh();}
restoreStatus();setInterval(countdown,1000);setInterval(refresh,3000);refresh();
</script></body></html>
