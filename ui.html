        // Cap the waiting segment at one cycle; keep nearly simultaneous markers legible.
        const shownWait = Math.min(wait, cycle);
        const position = known

            width: Math.max(8, plot / minutes),
            height: plotHeight + 6,
            class: "chart-hit",
          });
          const change =
            point.delta === null
              ? "无连续检测，变化未知"
              : point.delta < 0
                ? "消耗 " + (-point.delta).toFixed(0) + " 个百分点"
                : point.delta > 0
                  ? "恢复 " + point.delta.toFixed(0) + " 个百分点"
                  : "无变化";
          const statistics = "剩余 " + point.value + "% " + change;
          hit.setAttribute("tabindex", "0");
          hit.setAttribute("aria-label", time(point.minute) + " " + statistics);
          const show = (e) =>
            showChartTooltip(e, point.minute, statistics, hit);
          hit.addEventListener("pointerenter", show);
          hit.addEventListener("pointermove", show);
          hit.addEventListener("focus", show);
          hit.addEventListener("pointerleave", hideChartTooltip);
          hit.addEventListener("blur", hideChartTooltip);
          svg.append(hit);
        }
        $("chart-empty").hidden = points.length > 0;
        $("chart-empty").textContent = history.length
          ? "所选范围暂无额度数据"
          : "等待额度检测";
        const description = points.length
          ? `已记录 ${points.length} 分钟 · 消耗 ${Number(consumed.toFixed(0))} 个百分点 · 恢复 ${Number(recovered.toFixed(0))} 个百分点`
          : "每分钟记录一次；未检测时留空";
        svg.setAttribute(
          "aria-label",
          "Codex" +
            (key === "primaryRemaining" ? "五小时" : "周") +
            "额度变化，" +
            description,
        );
      }
      $("chart-window").addEventListener("change", rememberChartPreferences);
      $("chart-quota").addEventListener("change", rememberChartPreferences);
      if (typeof ResizeObserver !== "undefined")
        new ResizeObserver(renderChart).observe($("quota-chart"));
      if (typeof window !== "undefined")
        window.addEventListener("resize", renderChart);
      // Render synchronously: the browser paints only after the complete snapshot is applied.
      function renderStatus(s, announce = true) {
        connected = true;
        if (!s.current && snapshot?.current)
          s = { ...s, current: snapshot.current, timing: snapshot.timing };
        snapshot = s;
        paused = s.paused;
        $("version").textContent = "v" + s.version;
        $("badge").textContent = paused
          ? "停止运行"
          : s.connection?.stopped
            ? "已断开"
            : s.connection?.recoveryAt || s.connection?.failures
              ? "等待重连"
              : s.linked
                ? "后台运行"
                : s.busy
                  ? "正在连接"
                  : "等待连接";
        $("pause").textContent = paused ? "恢复运行" : "暂停";
        $("status").textContent = shortStatus(s);
        $("status-detail").textContent = s.status;
        $("status").title = s.status;
        renderErrorBanner(s);
        const c = s.current;
        if (c) {
          renderQuota("remaining", c.primary);
          renderQuota("weekly", c.secondary, c.weeklyResetAt);
          if (s.linked === false)
            $("remaining-copy").textContent = "连接中断，显示上次额度";
          timeBlock("checked", "checked-date", c.checkedAt);
          $("checked").title = time(c.checkedAt);
        }
        timeBlock("next-check", "next-check-date", s.nextPoll);
        $("next-check").title = time(s.nextPoll);
        renderTiming(s.timing);
        renderAutostart(s.autostart);
        if (!pollSettingBusy)
          $("poll-while-paused").checked = s.pollWhilePaused === true;
        renderChart();
        renderActivity(s);
        if (announce) showScheduleNotice(s.scheduleNotice);
      }

      let lastScheduleNotice = null;
      function showScheduleNotice(notice) {
        if (!notice?.id || notice.id === lastScheduleNotice ||
            Math.abs(Date.now() / 1000 - notice.time) > 120) return;
        lastScheduleNotice = notice.id;
        try {
          if (sessionStorage.getItem("quota-starter:schedule-notice") === notice.id) return;
          sessionStorage.setItem("quota-starter:schedule-notice", notice.id);
        } catch (e) { /* In-memory deduplication remains available. */ }
        showFeedback("toast", notice.message, true);
      }

      function showOffline() {
        setErrorBanner(
          "无法连接本机后台服务，请通过桌面快捷方式启动软件；若仍失败，请检查后台日志。",
        );
        connected = false;
        if (snapshot?.current)
          $("remaining-copy").textContent = "连接中断，显示上次额度";
        $("badge").textContent = "连接中断";
        $("status").textContent = "等待重连";
        $("status-detail").textContent = snapshot
          ? "连接暂时中断，保留上次数据，正在自动重试。"
          : "请通过桌面快捷方式启动。";
        $("status").title = $("status-detail").textContent;
        for (const id of [
          "reconnect",
          "pause",
          "recheck",
          "save-time",
          "auto-time",
          "autostart",
          "choose-time",
          "poll-while-paused",
        ])
          $(id).disabled = true;
      }
      function completeStatus(s) {
        return (
          s?.service === "quota-starter" &&
          typeof s.status === "string" &&
          typeof s.paused === "boolean" &&
          s.timing &&
          Array.isArray(s.attempts) &&
          Array.isArray(s.events)
        );
      }
      function restoreStatus() {
        try {
          const s = JSON.parse(sessionStorage.getItem(cacheKey));
          if (completeStatus(s)) {
            renderStatus(s, false);
            connected = false;
            // Cached values are for display only until the live service answers.
            for (const id of [
              "reconnect",
              "pause",
              "recheck",
              "save-time",
              "auto-time",
              "autostart",
              "choose-time",
              "poll-while-paused",
            ])
              $(id).disabled = true;
          }
        } catch (e) {
          /* Storage may be disabled or contain an obsolete snapshot. */
        }
      }
      async function refresh() {
        if (refreshPromise) return refreshPromise;
        refreshPromise = (async () => {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 15000);
          try {
            const r = await fetch("/api/status", {
              signal: controller.signal,
              cache: "no-store",
            });
            if (!r.ok) throw Error(r.status);
            const s = await r.json();
            if (!completeStatus(s)) throw Error("invalid status");
            renderStatus(s);
            if (!s.busy)
              try {
                sessionStorage.setItem(cacheKey, JSON.stringify(s));
              } catch (e) {}
          } catch (e) {
            showOffline();
          } finally {
            clearTimeout(timeout);
          }
        })();
        try {
          await refreshPromise;
        } finally {
          refreshPromise = null;
        }
      }
      const feedbackTimers = new Map();
      function showFeedback(id, message, success = false) {
        clearTimeout(feedbackTimers.get(id));
        feedbackTimers.delete(id);
        $(id).textContent = message;
        if (id === "schedule-feedback" || id === "toast") {
          feedbackTimers.set(
            id,
            setTimeout(
              () => {
                $(id).textContent = "";
                feedbackTimers.delete(id);
              },
              success ? 3500 : 7000,
            ),
          );
        }
      }
      async function recheckQuota() {
        if (recheckBusy) return;
        recheckBusy = true;
        updateControls();
        try {
          await action("check");
        } finally {
          recheckBusy = false;
          updateControls();
        }
      }
      async function action(name, feedback = "toast", body) {
        if (pendingActions.has(name)) return false;
        pendingActions.add(name);
        updateControls();
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 25000);
        try {
          const payload = body === undefined ? undefined : JSON.stringify(body);
          const send = () =>
            fetch("/api/" + name, {
              method: "POST",
              signal: controller.signal,
              headers: {
                "X-Quota-Token": token,
                "Content-Type": "application/json",
              },
              body: payload,
            });
          let r = await send(),
            d = await r.json();
          if (r.status === 403 && d.code === "stale_session") {
            const session = await fetch("/api/session", {
              signal: controller.signal,
              headers: { "X-Quota-Session": "refresh" },
              cache: "no-store",
            });
            if (!session.ok) throw Error("session refresh failed");
            const fresh = await session.json();
            if (typeof fresh.token !== "string" || !fresh.token)
              throw Error("invalid session");
            token = fresh.token;
            r = await send();
            d = await r.json();
          }
          operationError = r.ok
            ? ""
            : d.error || d.message || "操作失败，请检查日志";
          showFeedback(feedback, d.message || d.error, r.ok);
          if (refreshPromise) await refreshPromise;
          await refresh();
          return r.ok;
        } catch (e) {
          showOffline();
          showFeedback(feedback, "操作结果未确认，请检查当前状态后重试");
          return false;
        } finally {
          clearTimeout(timer);
          pendingActions.delete(name);
          updateControls();
          if (refreshDialog.open) renderWheels();
        }
      }

      async function saveTime() {
        if (!applyManualDate()) return;
        const { min, max } = bounds();
        if (!min || draftRefresh < min || draftRefresh > max) {
          $("refresh-error").textContent = "请选择可选范围内的刷新时间";
          renderWheels();
          return;
        }
        $("save-time").disabled = true;
        if (
          await action("schedule", "refresh-error", { refreshAt: draftRefresh })
        ) {
          refreshDialog.close();
          showFeedback("schedule-feedback", "已保存刷新时间", true);
        } else renderWheels();
      }
      $("save-time").addEventListener("click", saveTime);
      function renderAutostart(a) {
        if (startupBusy || !a) return;
        $("autostart").disabled = !a.available;
        if (a.enabled !== null) $("autostart").checked = a.enabled === true;
        $("startup-error").textContent = a.error || "";
      }
      async function setAutostart(enabled) {
        startupBusy = true;
        $("autostart").disabled = true;
        await action("autostart/" + (enabled ? "enable" : "disable"));
        startupBusy = false;
        await refresh();
      }
      async function setPollWhilePaused(enabled) {
        pollSettingBusy = true;
        updateControls();
        try {
          await action("settings/poll-while-paused", "toast", { enabled });
        } finally {
          pollSettingBusy = false;
          await refresh();
          updateControls();
        }
      }
      restoreStatus();
      setInterval(countdown, 1000);
      setInterval(refresh, 3000);
      refresh();
    </script>
  </body>
</html>
