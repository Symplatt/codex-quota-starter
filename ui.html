<header><h1>额度启程</h1><div style="display:flex;gap:12px;align-items:center"><span class="badge" id="badge">连接中</span><button class="link" type="button" id="open-help" aria-haspopup="dialog">帮助</button></div></header>
<div class="grid">
<section class="card"><div class="label">五小时剩余额度</div><div class="value" id="remaining">—</div><div class="small" id="weekly">每周额度：等待检测</div></section>
<section class="card"><div class="label">服务器刷新时间</div><div class="value time-value" id="reset">—</div><div class="small">北京时间</div></section>
<section class="card"><div class="label">上次发送请求</div><div class="value time-value" id="last">尚未发送</div><div class="small" id="result"></div></section>
</div>
<section class="panel time-panel"><div class="section-head"><div><h2>时间安排</h2></div></div>
<div class="time-pair"><svg class="time-connector" viewBox="0 0 28 28" fill="none" aria-hidden="true" focusable="false"><circle cx="14" cy="14" r="12.5"/><path d="M9 14h10m-4-4 4 4-4 4"/></svg>
<div class="time-block send-block"><div class="time-label"><span class="time-heading"><svg class="time-glyph" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="7.25"/><path d="M10 5.5V10l3 1.8"/></svg>请求发送</span><span class="count-chip" id="countdown"></span></div><div class="clock" id="send-at">—</div><div class="time-footer"><span id="send-date">—</span></div></div>
<div class="time-block estimate-block"><div class="time-label"><span class="time-heading"><svg class="time-glyph" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false"><path d="M16.4 8A6.7 6.7 0 1 0 16 13M16.5 3.5V8H12"/></svg>预计刷新</span></div><div class="clock" id="estimated-reset">—</div><div class="time-footer"><span id="reset-date">—</span></div></div>
</div>
<form id="schedule-form"><label for="schedule-day" class="editor-label">手动安排</label><div class="actions time-input"><div class="picker"><input id="schedule-time" type="hidden"><input id="schedule-day" type="date" required disabled aria-label="手动日期（北京时间）"><select id="schedule-hour" aria-label="小时" disabled></select><span>:</span><select id="schedule-minute" aria-label="分钟" disabled></select><span>:</span><select id="schedule-second" aria-label="秒" disabled></select></div><div class="schedule-buttons"><button class="primary" id="save-time" type="submit" disabled>保存</button><button id="auto-time" type="button" onclick="window.action('schedule/clear','schedule-feedback')">恢复自动</button></div></div></form>
<div class="feedback" id="schedule-feedback" role="status"></div></section>
<section class="panel"><div class="section-head"><h2>运行状态</h2><span class="state-chip" id="status">连接中</span></div><div class="run-row"><div class="actions"><button class="primary" id="trigger" onclick="action('trigger')">手动触发一次</button><button id="pause" onclick="action(paused?'resume':'pause')">暂停</button><button onclick="action('check')">立即检测</button></div><div class="checks small"><span>上次检测 <time id="checked">—</time></span><span>下次检测 <time id="next-check">—</time></span></div></div><details class="status-details"><summary>状态详情</summary><div class="small status" id="status-detail"></div></details><div class="feedback" id="toast" role="status"></div></section>
<section class="panel"><h2>触发记录</h2><div class="tablewrap"><table><thead><tr><th>时间（北京时间）</th><th>结果</th><th>周期验证</th></tr></thead><tbody id="history"></tbody></table></div><details><summary>查看检测日志</summary><pre id="logs"></pre></details></section>
<section class="panel"><h2>设置</h2><label style="display:flex;align-items:center;gap:12px"><input type="checkbox" id="autostart" disabled onchange="setAutostart(this.checked)"><span>开机自启动（登录 Windows 后）</span></label><div class="small" id="startup-status"></div></section>
<section class="panel"><h2>软件信息</h2><div class="info"><span>名称：额度启程</span><span>版本：<strong id="version">—</strong></span></div></section>
</main><dialog id="help-dialog" aria-labelledby="help-title"><div class="help-header"><div><h2 id="help-title">使用帮助</h2><p>额度启程 · 常用操作说明</p></div><button id="close-help" type="button" aria-label="关闭帮助">×</button></div><div class="help-content">__HELP_CONTENT__</div></dialog><script>
const helpDialog=document.getElementById('help-dialog');
document.getElementById('open-help').addEventListener('click',()=>helpDialog.showModal());
document.getElementById('close-help').addEventListener('click',()=>helpDialog.close());
let backdropDown=false;
helpDialog.addEventListener('pointerdown',e=>{const r=helpDialog.getBoundingClientRect();backdropDown=e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom;});
helpDialog.addEventListener('click',e=>{const r=helpDialog.getBoundingClientRect();if(backdropDown&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))helpDialog.close();backdropDown=false;});
const token='__CSRF__';let paused=false,snapshot=null,startupBusy=false,timeDirty=false,lastScheduleId,refreshPromise=null;
const cacheKey='quota-starter:last-status:v1';
const $=id=>document.getElementById(id);
const time=s=>s?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(s*1000)):'—';
const inputTime=s=>new Date(s*1000+8*3600000).toISOString().slice(0,19);
const labels={completed:'已完成',failed:'失败',interrupted:'已中断',unknown:'结果未知',reserved:'待核实'};
const clockTime=s=>s?time(s).split(' ')[1]:'—';
function timeBlock(id,dateId,value){$(id).textContent=clockTime(value);$(dateId).textContent=value?time(value).split(' ')[0]:'—';}
function shortStatus(s){if(s.paused)return '已暂停';if(s.busy)return '处理中';const v=s.status;if(v.startsWith('连接/检测失败'))return '检测失败';if(v.includes('额度受限'))return '额度受限';if(v.includes('手动设定'))return '等待计划';if(v.includes('本周期')||v.includes('已处理'))return '本轮已处理';if(v.includes('重置时间')||v.includes('窗口已变化'))return '等待刷新';if(v.includes('请求完成')||v.includes('观察到'))return '已完成';if(v.includes('未确认'))return '待核实';return '检测中';}
function renderTiming(t){if(!t)return;timeBlock('send-at','send-date',t.sendAt);timeBlock('estimated-reset','reset-date',t.estimatedResetAt);const plan=t.schedule;const id=plan?.id||null;if(id!==lastScheduleId&&!timeDirty){$('schedule-time').value=plan?.status==='pending'?inputTime(plan.sendAt):'';lastScheduleId=id;}syncPicker();$('save-time').disabled=!t.minSendAt||snapshot.busy;countdown();}
const pickerParts=['hour','minute','second'];
for(const [index,part] of pickerParts.entries()){
  for(let n=0;n<(index===0?24:60);n++){
    const option=document.createElement('option');
    option.value=String(n).padStart(2,'0');option.textContent=option.value;
    $('schedule-'+part).append(option);
  }
}
function pickerMinimum(){
  const reset=snapshot?.timing?.serverResetAt;
  return reset?Math.floor(Math.max(reset,Date.now()/1000))+1:null;
}
function syncPicker(fromInput=false){
  const min=pickerMinimum(),day=$('schedule-day');
  day.disabled=!min;
  for(const part of pickerParts)$('schedule-'+part).disabled=!min;
  if(!min)return;
  const lower=inputTime(min),minDay=lower.slice(0,10),minParts=lower.slice(11).split(':');
  day.min=minDay;day.title='最早可选 '+time(min);
  if(!fromInput){
    const value=$('schedule-time').value||lower;
    day.value=value.slice(0,10);
    value.slice(11).split(':').forEach((v,i)=>{$('schedule-'+pickerParts[i]).value=v;});
  }
  // Each disabled option represents an entire interval before the lower bound.
  // Date changes clamp the draft to the first selectable instant; no request is sent.
  if(day.value&&day.value<minDay)day.value=minDay;
  let constrained=day.value===minDay;
  for(let i=0;i<pickerParts.length;i++){
    const select=$('schedule-'+pickerParts[i]),floor=constrained?minParts[i]:'00';
    for(const option of select.options)option.disabled=option.value<floor;
    if(select.value<floor)select.value=floor;
    constrained=constrained&&select.value===minParts[i];
  }
  $('schedule-time').value=day.value?day.value+'T'+pickerParts.map(p=>$('schedule-'+p).value).join(':'):'';
}
for(const id of ['schedule-day',...pickerParts.map(p=>'schedule-'+p)]){
  $(id).addEventListener('change',()=>{timeDirty=true;syncPicker(true);});
}
function countdown(){const t=snapshot?.timing;if(!t)return;const left=t.sendAt-Date.now()/1000;const pad=n=>String(n).padStart(2,'0');$('countdown').textContent=paused?'已暂停':!t.sendAt?'待检测':left>0?'倒计时 '+pad(Math.floor(left/3600))+':'+pad(Math.floor(left%3600/60))+':'+pad(Math.floor(left%60)):'已到点';}
// Render synchronously: the browser paints only after the complete snapshot is applied.
function renderStatus(s){snapshot=s;paused=s.paused;$('version').textContent='v'+s.version;$('badge').textContent=paused?'已暂停':s.busy?'正在检测 / 发送':'后台运行';$('pause').textContent=paused?'恢复运行':'暂停';$('trigger').disabled=paused||s.busy;$('save-time').disabled=s.busy;$('auto-time').disabled=s.busy;$('status').textContent=shortStatus(s);$('status-detail').textContent=s.status;const c=s.current;if(c){$('remaining').textContent=(100-c.primary.usedPercent)+'%';$('weekly').textContent=c.secondary?'长周期（'+Math.round(c.secondary.windowDurationMins/1440)+' 天）剩余 '+(100-c.secondary.usedPercent)+'%':'长周期：未返回';$('reset').textContent=time(c.primary.resetsAt);$('checked').textContent=clockTime(c.checkedAt);$('checked').title=time(c.checkedAt);$('next-check').textContent=clockTime(s.nextPoll);$('next-check').title=time(s.nextPoll);}renderTiming(s.timing);renderAutostart(s.autostart);const a=s.attempts[0];if(a){$('last').textContent=time(a.started);$('result').textContent=labels[a.status]||a.status;}else{$('last').textContent='尚未发送';$('result').textContent='';}const body=$('history');body.replaceChildren();for(const a of s.attempts){const tr=document.createElement('tr');for(const text of [time(a.started),labels[a.status]||a.status,a.detail.evidence||'请求已预留，本周期不重复提交']){const td=document.createElement('td');td.textContent=text;tr.append(td);}body.append(tr);}if(!s.attempts.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=3;td.textContent='暂无记录';tr.append(td);body.append(tr);}$('logs').textContent=s.events.map(e=>time(e.time)+' '+e.kind+' '+JSON.stringify(e.detail)).join('\n');}
function showOffline(){ $('badge').textContent='连接中断';$('status').textContent='等待重连';$('status-detail').textContent=snapshot?'连接暂时中断，保留上次数据，正在自动重试。':'请通过桌面快捷方式启动。';$('schedule-time').disabled=true;for(const id of ['trigger','save-time','auto-time','autostart','schedule-day','schedule-hour','schedule-minute','schedule-second'])$(id).disabled=true;}
function completeStatus(s){
  return s?.service==='quota-starter'&&typeof s.status==='string'&&typeof s.paused==='boolean'
    &&s.current?.primary&&s.timing&&Array.isArray(s.attempts)&&Array.isArray(s.events);
}
function restoreStatus(){
  try{const s=JSON.parse(sessionStorage.getItem(cacheKey));if(completeStatus(s)){
    renderStatus(s);
    // Cached values are for display only until the live service answers.
    for(const id of ['trigger','save-time','auto-time','autostart','schedule-day','schedule-hour','schedule-minute','schedule-second'])$(id).disabled=true;
  }}catch(e){/* Storage may be disabled or contain an obsolete snapshot. */}
}
async function refresh(){
  if(refreshPromise)return refreshPromise;
  refreshPromise=(async()=>{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),15000);
    try{
      const r=await fetch('/api/status',{signal:controller.signal,cache:'no-store'});
      if(!r.ok)throw Error(r.status);
      const s=await r.json();
      // A running check can expose a mixture of old and new server values.
      // Keep the last complete display (including its ticking clock) until it ends.
      if(snapshot&&(s.busy||!completeStatus(s))){
        paused=s.paused;
        $('pause').textContent=paused?'恢复运行':'暂停';
        $('trigger').disabled=true;$('save-time').disabled=true;$('auto-time').disabled=true;
        countdown();return;
      }
      if(!completeStatus(s)){if(!snapshot){$('badge').textContent=s.busy?'正在检测':'等待检测';$('status-detail').textContent=s.status||'等待首次检测结果';}return;}
      renderStatus(s);
      if(!s.busy)try{sessionStorage.setItem(cacheKey,JSON.stringify(s));}catch(e){}
    }catch(e){showOffline();}
    finally{clearTimeout(timeout);}
  })();
  try{await refreshPromise;}finally{refreshPromise=null;}
}
async function action(name,feedback='toast',body){try{const r=await fetch('/api/'+name,{method:'POST',headers:{'X-Quota-Token':token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();$(feedback).textContent=d.message||d.error;if(r.ok&&name.startsWith('schedule')){timeDirty=false;lastScheduleId=undefined;}if(refreshPromise)await refreshPromise;await refresh();return r.ok;}catch(e){$(feedback).textContent='操作失败：本地服务不可达';return false;}}
function saveTime(){const v=$('schedule-time').value;const sendAt=Date.parse(v.length===16?v+':00+08:00':v+'+08:00')/1000;const reset=snapshot?.timing?.serverResetAt;if(!reset){$('schedule-feedback').textContent='请先检测 GPT 刷新时间';return;}if(!v||!Number.isFinite(sendAt)||sendAt<=Date.now()/1000){$('schedule-feedback').textContent='请选择未来时间';return;}if(sendAt<=reset){$('schedule-feedback').textContent='仅可选 GPT 正常刷新时刻之后';return;}action('schedule','schedule-feedback',{sendAt});}
$('schedule-form').addEventListener('submit',e=>{e.preventDefault();saveTime();});
$('schedule-day').addEventListener('invalid',()=>{$('schedule-feedback').textContent='请选择可选起点之后的时间（含起点）';});

function renderAutostart(a){if(startupBusy||!a)return;$('autostart').disabled=!a.available;$('autostart').checked=a.enabled===true;$('startup-status').textContent=a.error|| (a.enabled?'已开启':'已关闭');}
async function setAutostart(enabled){startupBusy=true;$('autostart').disabled=true;await action('autostart/'+(enabled?'enable':'disable'));startupBusy=false;await refresh();}
restoreStatus();setInterval(countdown,1000);setInterval(refresh,3000);refresh();
</script></body></html>
